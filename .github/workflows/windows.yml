name: Windows checks and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install ANGLE and optional source runtimes
        shell: pwsh
        run: |
          ./tools/setup_angle.ps1
          ./tools/setup_youtube.ps1
          ./tools/setup_danmaku.ps1
          python tools/setup_video_enhancements.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --fatal-warnings
      - run: flutter test --no-pub
      - run: flutter build windows --release --no-pub
      - name: Package portable Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Kazumi-Enhanced-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kazumi-Enhanced-windows-x64
          path: Kazumi-Enhanced-windows-x64.zip
          retention-days: 14
